[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "trimes"
version = "0.1.1"
authors = [
  { name="Sciemon", email="simon.eberlein@gmx.de" },
]
description = "A python package for transient time series"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core trimes -- `import trimes`, trimes.base and trimes.synchrophasor -- runs
# on numpy + pandas alone. Everything heavier is an extra (see below).
dependencies = [
    "pandas >= 2.2.3",
    "numpy >= 1.24",
]

[project.optional-dependencies]
# trimes.plots and the PeriodicSignal.plot* helpers
viz = ["matplotlib > 3"]
# trimes.fft, trimes.phasor, trimes.filter, trimes.derivative, get_angle
dsp = ["scipy >= 1.18.1"]
# trimes.control (step-response interface) + nicer debug output
control = [
    "control > 0.10",
    "icecream >= 2.1.2",
    "matplotlib > 3",
]
all = [
    "matplotlib > 3",
    "scipy >= 1.18.1",
    "control > 0.10",
    "icecream >= 2.1.2",
]
test = [
    "pytest >= 7.0",
    "scikit-learn >= 1.3",
    "matplotlib > 3",
    "scipy >= 1.18.1",
    "control > 0.10",
    "icecream >= 2.1.2",
]

[project.urls]
"Homepage" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/trimes"
"Bug Tracker" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/trimes/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
