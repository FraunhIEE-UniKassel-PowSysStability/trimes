[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[project]
name = "trimes"
version = "0.1.1"
authors = [
  { name="Sciemon", email="simon.eberlein@gmx.de" },
]
description = "A python package for transient time series"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core trimes -- `import trimes`, the `.trimes` accessor, trimes.base,
# trimes.analytic and trimes.synchrophasor (the `.plot` submodule aside) -- runs
# on numpy + pandas alone. Everything heavier is an extra (see below).
# The declared lower bounds are exercised by the `minimum-deps` CI job.
dependencies = [
    "pandas >= 2.1.0",
    "numpy >= 1.24",
]

[project.optional-dependencies]
# trimes.plots and the PeriodicSignal.plot* helpers.
# >= 3.6 for the subplots(height_ratios=...) argument used by plot_bode.
viz = ["matplotlib >= 3.6"]
# trimes.fft, trimes.filter, trimes.derivative, signal_processing.get_angle
# (trimes.phasor is numpy-only and needs no extra)
dsp = ["scipy >= 1.11"]
# trimes.control (step-response interface) + nicer debug output
control = [
    "control >= 0.10",
    "icecream >= 2.1.2",
    "matplotlib >= 3.6",
]
all = [
    "matplotlib >= 3.6",
    "scipy >= 1.11",
    "control >= 0.10",
    "icecream >= 2.1.2",
]
test = [
    "pytest >= 7.0",
    "scikit-learn >= 1.3",
    "matplotlib >= 3.6",
    "scipy >= 1.11",
    "control >= 0.10",
    "icecream >= 2.1.2",
]

[project.urls]
"Homepage" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/trimes"
"Bug Tracker" = "https://github.com/FraunhIEE-UniKassel-PowSysStability/trimes/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trimes"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
